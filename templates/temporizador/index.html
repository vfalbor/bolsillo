<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Temporizador de cocina</title>
  <style>
    :root { --bg: #fff6ee; --card: #fff; --ink: #2a1d14; --soft: #8a7466; --accent: #e0662f; --line: #f0dccd; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1a1310; --card: #251b16; --ink: #f6e9df; --soft: #b19a8b; --line: #3a2b23; --accent: #f08048; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.4 system-ui, sans-serif; padding: 20px 16px 40px; max-width: 560px; margin-inline: auto; }
    h1 { margin: 0 0 16px; font-size: 28px; }
    .presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    button { font: inherit; border: 0; border-radius: 16px; padding: 14px 10px; background: var(--card); color: var(--ink); border: 1px solid var(--line); }
    form { display: flex; gap: 8px; margin-bottom: 20px; }
    input { min-width: 0; font: inherit; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: inherit; }
    #name { flex: 2; } #mins { flex: 1; }
    .go { background: var(--accent); color: #fff; border: 0; font-weight: 600; }
    .timer { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; }
    .timer .left { flex: 1; }
    .timer .time { font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
    .timer.ring { border-color: var(--accent); animation: pulse 1s infinite; }
    @keyframes pulse { 50% { background: var(--accent); color: #fff; } }
  </style>
</head>
<body>
  <h1>⏲️ Temporizador</h1>
  <div class="presets" id="presets"></div>
  <form id="new"><input id="name" placeholder="¿Qué cocinas?" autocomplete="off"><input id="mins" type="number" min="1" max="600" value="10" aria-label="Minutos"><button class="go">Empezar</button></form>
  <div id="timers"></div>
  <script>
    const PRESETS = [['🍝 Pasta', 9], ['🥚 Huevo', 10], ['🍕 Horno', 15], ['🍚 Arroz', 18], ['☕ Té', 4], ['🍰 Bizcocho', 35]];
    const timers = [];
    const $ = (id) => document.getElementById(id);
    const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.max(0, s) % 60).padStart(2, '0')}`;

    function say(text) {
      try { speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance(text), { lang: 'es-ES' })); } catch {}
      // Inside Bolsillo the phone can also speak and vibrate:
      fetch('http://127.0.0.1:7700/api/device/speak', { method: 'POST', body: JSON.stringify({ text }) }).catch(() => {});
      fetch('http://127.0.0.1:7700/api/device/vibrate', { method: 'POST', body: JSON.stringify({ ms: 800 }) }).catch(() => {});
    }

    function start(name, mins) {
      timers.push({ name: name || 'Temporizador', end: Date.now() + mins * 60000, rang: false });
      render();
    }

    function render() {
      $('timers').replaceChildren(...timers.map((t, i) => {
        const left = Math.round((t.end - Date.now()) / 1000);
        const box = document.createElement('div');
        box.className = 'timer' + (left <= 0 ? ' ring' : '');
        box.innerHTML = '<div class="left"><div class="name"></div><div class="time"></div></div>';
        box.querySelector('.name').textContent = t.name;
        box.querySelector('.time').textContent = left > 0 ? fmt(left) : '¡Listo!';
        const stop = Object.assign(document.createElement('button'), { textContent: left > 0 ? 'Cancelar' : 'Parar' });
        stop.onclick = () => { timers.splice(i, 1); render(); };
        box.append(stop);
        if (left <= 0 && !t.rang) { t.rang = true; say(`${t.name} está listo`); }
        return box;
      }));
    }

    $('presets').replaceChildren(...PRESETS.map(([n, m]) => Object.assign(document.createElement('button'), { textContent: `${n} · ${m}′`, onclick: () => start(n.slice(3), m) })));
    $('new').onsubmit = (e) => { e.preventDefault(); start($('name').value.trim(), Number($('mins').value) || 1); $('name').value = ''; };
    setInterval(render, 1000);
  </script>
</body>
</html>
