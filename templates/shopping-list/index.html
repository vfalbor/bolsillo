<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shopping list</title>
  <style>
    :root { --bg: #f3f7f1; --card: #fff; --ink: #1f2a1d; --soft: #6b7867; --accent: #2f8f4e; --line: #dde6d9; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141a13; --card: #1d251b; --ink: #e8efe5; --soft: #9aa895; --line: #2c3729; --accent: #4fb36f; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.4 system-ui, sans-serif; padding: 20px 16px 40px; max-width: 560px; margin-inline: auto; }
    h1 { margin: 0 0 16px; font-size: 28px; }
    form { display: flex; gap: 8px; margin-bottom: 18px; }
    input { flex: 1; font: inherit; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: inherit; }
    button { font: inherit; border: 0; border-radius: 14px; padding: 12px 16px; background: var(--accent); color: #fff; font-weight: 600; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
    li { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
    li.done span { text-decoration: line-through; color: var(--soft); }
    li span { flex: 1; }
    li input[type=checkbox] { width: 26px; height: 26px; flex: none; accent-color: var(--accent); }
    .x { background: none; color: var(--soft); padding: 4px 8px; }
    h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--soft); margin: 26px 0 10px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chips button { background: var(--card); color: var(--ink); border: 1px solid var(--line); font-weight: 400; padding: 8px 12px; border-radius: 999px; }
    .empty { color: var(--soft); text-align: center; padding: 20px; }
  </style>
</head>
<body>
  <h1>🛒 Shopping list</h1>
  <form id="add"><input id="item" placeholder="Milk, bread, tomatoes…" autocomplete="off" aria-label="Item"><button>Add</button></form>
  <ul id="list"></ul>
  <h2>The usual</h2>
  <div class="chips" id="usual"></div>
  <script>
    const KEY = 'lista-compra'; // storage key kept from the first version so saved lists survive
    const state = JSON.parse(localStorage.getItem(KEY) || '{"items":[],"usual":{}}');
    const save = () => localStorage.setItem(KEY, JSON.stringify(state));
    const $ = (id) => document.getElementById(id);

    function add(name) {
      name = name.trim();
      if (!name || state.items.some((i) => i.name.toLowerCase() === name.toLowerCase() && !i.done)) return;
      state.items.unshift({ name, done: false });
      state.usual[name] = (state.usual[name] || 0) + 1;
      save(); render();
    }

    function render() {
      $('list').replaceChildren(...state.items.map((it, n) => {
        const li = document.createElement('li');
        li.className = it.done ? 'done' : '';
        const box = Object.assign(document.createElement('input'), { type: 'checkbox', checked: it.done });
        box.onchange = () => { it.done = box.checked; save(); render(); };
        const del = Object.assign(document.createElement('button'), { className: 'x', textContent: '✕', ariaLabel: 'Remove' });
        del.onclick = () => { state.items.splice(n, 1); save(); render(); };
        li.append(box, Object.assign(document.createElement('span'), { textContent: it.name }), del);
        return li;
      }));
      if (!state.items.length) $('list').append(Object.assign(document.createElement('li'), { className: 'empty', textContent: 'The list is empty 🎉' }));
      const usual = Object.entries(state.usual).sort((a, b) => b[1] - a[1]).slice(0, 12).map(([name]) => name);
      $('usual').replaceChildren(...usual.map((name) => Object.assign(document.createElement('button'), { textContent: `+ ${name}`, onclick: () => add(name) })));
    }

    $('add').onsubmit = (e) => { e.preventDefault(); add($('item').value); $('item').value = ''; $('item').focus(); };
    render();
  </script>
</body>
</html>
