<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#14161a">
  <title>Bolsillo · Linux</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="vendor/xterm.css">
  <style>
    :root { --bg:#14161a; --fg:#e8e6e1; --dim:#9a978f; --acc:#f2a541; --ok:#6cc070; --bad:#e5604c; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
      font: 15px/1.4 -apple-system, system-ui, sans-serif; }
    body { display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); }
    header { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid #2a2d33; }
    header b { font-size: 16px; }
    #status { flex: 1; color: var(--dim); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* Loading bar: how long until Linux and Claude are ready (based on how long this iPhone took last time). */
    #progress { padding: 6px 12px 7px; border-bottom: 1px solid #2a2d33; font-size: 13px; }
    #progress[hidden] { display: none; }
    #progressBar { height: 6px; border-radius: 3px; background: #2a2d33; overflow: hidden; margin-bottom: 4px; }
    #progressBar i { display: block; height: 100%; width: 0; background: var(--acc); transition: width .8s; }
    #progress[data-done] #progressBar i { background: var(--ok); }
    #progressText { color: var(--dim); }
    #status.ok { color: var(--ok); } #status.bad { color: var(--bad); }
    nav { display: flex; gap: 4px; }
    nav button { background: #23262c; color: var(--fg); border: 0; border-radius: 8px; padding: 6px 12px; font: inherit; }
    nav button[aria-pressed="true"] { background: var(--acc); color: #14161a; }
    header { position: relative; }
    #more { position: absolute; right: 8px; top: 100%; z-index: 20; display: flex; flex-direction: column; gap: 4px; min-width: 220px;
      background: #1c1f24; border: 1px solid #3a3e46; border-radius: 12px; padding: 6px; box-shadow: 0 8px 24px #0008; }
    #more[hidden] { display: none; }
    #more button { background: none; color: var(--fg); border: 0; border-radius: 8px; padding: 10px 12px; font: inherit; text-align: left; }
    #more button[aria-pressed="true"] { background: #2a2d33; }
    #more button[hidden] { display: none; }
    .msg.login .copy { color: var(--acc); font-size: 14px; background: none; padding: 0; text-decoration: underline; }
    .msg.login input { width: 100%; font: 12px ui-monospace, monospace; background: #0f1114; color: var(--fg); border: 1px solid #3a3e46; border-radius: 8px; padding: 6px; }
    main { flex: 1; position: relative; min-height: 0; }
    main > section { position: absolute; inset: 0; display: none; }
    main > section.on { display: block; }
    #panel iframe { width: 100%; height: 100%; border: 0; background: #fff; }
    #wait { display: flex; height: 100%; align-items: center; justify-content: center; flex-direction: column;
      gap: 8px; padding: 24px; text-align: center; color: var(--dim); }
    #wait strong { color: var(--fg); font-size: 17px; }
    #term.on { display: flex; flex-direction: column; }
    /* Chat: Safari draws it (fast); Claude, without its terminal UI, only sends and receives JSON. */
    #chat.on { display: flex; flex-direction: column; }
    #chatState { padding: 6px 12px; font-size: 13px; color: var(--dim); border-bottom: 1px solid #2a2d33; }
    #chatLog { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 92%; padding: 8px 11px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; line-height: 1.4; }
    .msg.me { align-self: flex-end; background: var(--acc); color: #14161a; }
    .msg.cc { align-self: flex-start; background: #23262c; }
    .msg.tool { align-self: flex-start; background: none; color: var(--dim); font: 12px ui-monospace, monospace; padding: 0 4px; }
    .msg.err { align-self: flex-start; background: #3a1f1b; }
    .msg.login { display: flex; flex-direction: column; gap: 8px; }
    .msg.login a { align-self: flex-start; background: var(--acc); color: #14161a; border-radius: 10px; padding: 10px 16px; font-weight: 600; text-decoration: none; }
    .msg.login a[aria-disabled] { opacity: .5; pointer-events: none; }
    .msg.login a.second { background: #3a3e46; color: var(--fg); }
    .msg.login.opened a.go { background: #3a3e46; color: var(--fg); }
    .msg.login.opened a.second { background: var(--acc); color: #14161a; }
    .msg.login span { color: var(--dim); font-size: 14px; }
    #chatInput { background: #1c1f24; color: var(--fg); border: 1px solid #3a3e46; border-radius: 10px;
      padding: 9px 10px; font: 16px -apple-system, system-ui, sans-serif; }
    #chatSend { background: var(--acc); color: #14161a; border: 0; border-radius: 10px; padding: 9px 14px; font: inherit; font-weight: 600; }
    #chatForm { display: flex; gap: 6px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); border-top: 1px solid #2a2d33; align-items: flex-end; }
    #chatInput { flex: 1; resize: none; min-height: 40px; max-height: 30vh; }
    #terminal { flex: 1; min-height: 0; padding: 4px; }
    #termLink { display: flex; gap: 8px; align-items: center; padding: 6px 10px; background: #2a2416; font-size: 13px; }
    #termLink[hidden] { display: none; }
    #termLink span { flex: 1; } #termLink a, #termLink button { background: var(--acc); color: #14161a; border: 0; border-radius: 8px;
      padding: 6px 12px; font: inherit; font-weight: 600; text-decoration: none; }
    /* Keys the phone keyboard doesn't have. Ctrl stays pressed for the next key. */
    #keys { display: flex; gap: 4px; overflow-x: auto; padding: 4px 6px calc(4px + env(safe-area-inset-bottom)); border-top: 1px solid #2a2d33; }
    #keys button { flex: none; min-width: 40px; background: #23262c; color: var(--fg); border: 0; border-radius: 6px;
      padding: 8px 10px; font: 13px ui-monospace, monospace; }
    #keys button[aria-pressed="true"] { background: var(--acc); color: #14161a; }
    #debug { overflow: auto; padding: 8px 12px 24px; font: 12px/1.4 ui-monospace, monospace; }
    #debug h3 { font: 600 13px -apple-system, system-ui, sans-serif; margin: 12px 0 4px; color: var(--acc); }
    #debug pre { white-space: pre-wrap; word-break: break-all; margin: 0; color: var(--fg); }
    #debug .ev { color: var(--dim); } #debug .ev b { color: var(--fg); font-weight: 500; }
    #debug button { background: #23262c; color: var(--fg); border: 1px solid var(--acc); border-radius: 8px; padding: 5px 10px; font: inherit; }
    /* Monitor: always visible, has its own strip and never covers the app. */
    #health { border-bottom: 1px solid #2a2d33; font-size: 13px; }
    #healthBar { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 12px; background: none; border: 0;
      color: var(--fg); font: inherit; text-align: left; }
    #healthDot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); flex: none; }
    #health[data-level="ok"] #healthDot { background: var(--ok); }
    #health[data-level="warn"] #healthDot { background: var(--acc); }
    #health[data-level="bad"] #healthDot { background: var(--bad); }
    #health[data-level="bad"] #healthBar { background: #3a1f1b; }
    #healthText { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #healthMore { padding: 0 12px 8px 29px; color: var(--dim); max-height: 40vh; overflow: auto; }
    #healthMore ul { margin: 4px 0; padding-left: 16px; color: var(--fg); }
    #healthMore a { color: var(--acc); }
    #healthMore dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 6px 0 0; }
    #healthMore dd { margin: 0; color: var(--fg); }
    .bgBtn { margin: 6px 6px 0 0; background: #23262c; color: var(--fg); border: 1px solid var(--acc); border-radius: 8px;
      padding: 5px 10px; font: inherit; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <b>Bolsillo</b>
    <span id="status">Getting ready…</span>
    <nav>
      <button id="tChat" aria-pressed="false" hidden>Chat</button>
      <button id="tPanel" aria-pressed="true">Apps</button>
      <button id="tTerm" aria-pressed="false">Terminal</button>
      <button id="tDebug" aria-pressed="false" hidden>Debug</button>
      <button id="tMore" aria-expanded="false" aria-controls="more" aria-label="More options" hidden>⋯</button>
    </nav>
    <div id="more" hidden>
      <button id="mCopyToken" type="button">Copy my Claude token</button>
      <button id="mLogout" type="button">Sign out of Claude</button>
    </div>
  </header>
  <div id="progress" hidden>
    <div id="progressBar"><i></i></div>
    <span id="progressText">Getting ready…</span>
  </div>
  <div id="health" data-level="">
    <button id="healthBar" aria-expanded="false" aria-controls="healthMore">
      <span id="healthDot"></span><span id="healthText">Watching memory…</span><span aria-hidden="true">▾</span>
    </button>
    <div id="healthMore" role="status" aria-live="polite" hidden></div>
  </div>
  <main>
    <section id="panel" class="on">
      <div id="wait"><strong>Starting your Linux…</strong><span id="waitMsg">The first time takes a few minutes.</span></div>
    </section>
    <section id="chat">
      <div id="chatState" role="status" aria-live="polite">Starting Linux…</div>
      <div id="chatLog" aria-live="polite"></div>
      <form id="chatForm">
        <textarea id="chatInput" rows="2" placeholder="Write to Claude…" autocapitalize="sentences"></textarea>
        <button type="submit" id="chatSend">Send</button>
      </form>
    </section>
    <section id="term">
      <div id="termLink" hidden><span>Sign-in link:</span><a id="termLinkOpen" target="_blank" rel="noopener">Open</a><button type="button" id="termLinkCopy">Copy</button></div>
      <div id="terminal"></div>
      <div id="keys" role="toolbar" aria-label="Special keys">
        <button data-k="paste">Paste</button><button data-k="ctrl" aria-pressed="false">Ctrl</button><button data-k="\x03">^C</button><button data-k="\x1b">Esc</button>
        <button data-k="\t">Tab</button><button data-k="\x1b[A">↑</button><button data-k="\x1b[B">↓</button>
        <button data-k="\x1b[D">←</button><button data-k="\x1b[C">→</button><button data-k="\x04">^D</button>
        <button data-k="\x1a">^Z</button><button data-k="\x0c">^L</button><button data-k="|">|</button>
        <button data-k="~">~</button><button data-k="/">/</button><button data-k="-">-</button>
      </div>
    </section>
    <section id="debug"></section>
  </main>

  <script src="./lazy-load.js"></script>
  <script src="vendor/xterm.js"></script>
  <script src="vendor/xterm-pty.js"></script>
  <script type="module">
    import './arg-module.js';
    import initEmscriptenModule from './out.js';

    const $ = (id) => document.getElementById(id);
    const started = performance.now();
    const secs = () => Math.round((performance.now() - started) / 1000);
    const status = (text, cls = '') => { $('status').textContent = text; $('status').className = cls; };
    window.bolsillo = { events: [] }; // for the automated tests
    let tail = ''; // the last thing Linux wrote to the terminal
    // What leaves this page (reports to the server) never carries Claude tokens or the sign-in code.
    const redact = (t) => t.replace(/sk-ant-[A-Za-z0-9_-]+/g, 'sk-ant-…(hidden)').replace(/(Paste code here if prompted > )\S+/g, '$1…(hidden)');
    // Debug mode (?debug=1, remembered): a Debug tab with everything happening behind the scenes, and the
    // server gets the state every 5 s (with the terminal) so it can be analyzed live.
    const urlDebug = new URLSearchParams(location.search).get('debug');
    try { if (urlDebug != null) localStorage.setItem('bolsillo-debug', urlDebug === '1' ? '1' : ''); } catch {}
    // Chat mode by default; ?mode=tui keeps Claude's terminal interface.
    const CHAT = new URLSearchParams(location.search).get('mode') !== 'tui';
    const chatText = new TextDecoder();
    const DEBUG = (() => { try { return localStorage.getItem('bolsillo-debug') === '1'; } catch { return urlDebug === '1'; } })();
    const debugLog = []; // { t, text }
    let vmDebug = null; // the latest from /api/debug
    const dlog = (text) => {
      debugLog.push({ t: secs(), at: new Date().toLocaleTimeString(), text });
      if (debugLog.length > 400) debugLog.shift();
      if (DEBUG && $('debug').classList.contains('on')) renderDebug();
    };
    // ---- Loading bar ----
    // Stages: download the emulator, boot Linux and load Claude Code (and, if needed, sign in). Each one
    // advances with the time it took last time on this iPhone (it's saved), and ends with the real signal:
    // Linux up, and Claude answering "initialize" (chat) or showing its screen (terminal). Time is counted
    // in seconds of active page: if iOS freezes it, it doesn't advance.
    const progress = (() => {
      // From a snapshot (Linux and Claude already loaded) the stages are different: it's almost all reading it.
      const SNAP = !!window.bolsilloDisk?.useSnapshot;
      const KEY = SNAP ? 'bolsillo-times-snap' : 'bolsillo-times';
      const past = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } })();
      const expect = SNAP ? { download: past.download || 25, linux: past.linux || 90, login: 30, claude: past.claude || 20 }
        : { download: past.download || 25, linux: past.linux || 45, login: past.login || 420, claude: past.claude || 420 };
      const label = { download: 'Downloading the emulator', linux: SNAP ? 'Restoring Linux and Claude, already loaded' : 'Booting Linux', login: 'Preparing Claude sign-in',
        waiting: 'Waiting for you to authorize on claude.ai', claude: 'Loading Claude Code' };
      const P = { stage: 'download', ticks: 0, at: { download: 0 }, done: false, waiting: false };
      const save = (k, v) => { past[k] = Math.round(v); try { localStorage.setItem(KEY, JSON.stringify(past)); } catch {} };
      const enter = (stage) => {
        if (P.done || P.stage === stage) return;
        const used = P.ticks - (P.at[P.stage] ?? 0);
        if (P.stage !== 'waiting' && used > 3) save(P.stage, used);
        P.stage = stage; P.at[stage] = P.ticks; P.waiting = stage === 'waiting';
        render();
      };
      const fmt = (s) => s < 90 ? `${Math.max(5, Math.round(s / 5) * 5)} s` : `${Math.round(s / 60)} min`;
      const render = () => {
        const el = $('progress');
        if (!el) return;
        el.hidden = false;
        const order = ['download', 'linux', 'claude'];
        const weight = SNAP ? { download: 10, linux: 80, claude: 10 } : { download: 8, linux: 22, claude: 70 };
        const cur = P.stage === 'login' || P.stage === 'waiting' ? 'claude' : P.stage;
        const i = order.indexOf(cur);
        const spent = P.ticks - (P.at[P.stage] ?? 0);
        const d = window.bolsilloDisk;
        // When restoring the snapshot we know how much is really left: the MB of it QEMU has already read.
        const real = SNAP && P.stage === 'linux' && d.snapSizeMB ? d.snapMB / d.snapSizeMB : null;
        const frac = P.waiting ? 0 : Math.min(0.97, real ?? spent / expect[P.stage]);
        let pct = order.slice(0, i).reduce((a, k) => a + weight[k], 0) + (P.stage === 'login' ? 0 : weight[cur] * frac);
        if (P.done) pct = 100;
        let left = P.waiting ? 0 : real > 0.05 ? spent / real - spent : Math.max(0, expect[P.stage] - spent);
        for (const k of order.slice(i + 1)) left += expect[k];
        if (P.stage === 'login') left += expect.claude;
        el.querySelector('i').style.width = `${pct.toFixed(1)}%`;
        el.toggleAttribute('data-done', P.done);
        $('progressText').textContent = P.done ? P.doneText
          : P.waiting ? `${label.waiting} · then Claude takes ~${fmt(expect.claude)}`
          : `${label[P.stage]}… ${Math.round(pct)}% · ~${fmt(left)} left`;
      };
      setInterval(() => { if (!P.done) { P.ticks++; render(); } }, 1000);
      return {
        on(name) { if (name === 'module') enter('linux'); if (name === 'shell' && !CHAT) enter('claude'); },
        linuxReady() { enter('claude'); },
        login() { enter('login'); },
        waiting() { enter('waiting'); },
        claudeLoading() { if (P.stage !== 'claude') enter('claude'); },
        ready(text) {
          if (P.done) return;
          const used = P.ticks - (P.at.claude ?? 0);
          if (used > 3) save('claude', used);
          P.done = true; P.doneText = text || `Claude ready (${fmt(P.ticks)} in total)`;
          render(); setTimeout(() => { $('progress').hidden = true; }, 8000);
        },
      };
    })();
    window.bolsillo.progress = progress;

    const mark = (name, extra) => {
      window.bolsillo.events.push({ name, t: secs(), ...extra });
      progress.on(name);
      console.log(`[bolsillo] ${name} +${secs()}s`);
      dlog(`milestone: ${name}${extra ? ' ' + JSON.stringify(extra) : ''}`);
      report(name);
    };
    // Report for whoever is testing: every milestone and, every 20 s, the disk state; the gateway logs it.
    const report = (name) => {
      try {
        navigator.sendBeacon('/vm/report', JSON.stringify({ name, t: secs(), ua: navigator.userAgent, disk: window.bolsilloDisk,
          heapMB: performance.memory ? Math.round(performance.memory.usedJSHeapSize / 1048576) : undefined,
          health: window.bolsillo.health, bg: window.bolsillo.bg, net: window.bolsillo.net, hidden: document.hidden,
          tail: DEBUG ? redact(tail.slice(-3000)) : name === 'error' || name === 'shell' ? redact(tail.slice(-600)) : undefined,
          debug: DEBUG ? { log: debugLog.slice(-15), diag: vmDebug?.diag, diagLog: vmDebug?.logs?.['/var/log/bolsillo-diag.log']?.slice(-4000),
            monitor: vmDebug?.logs?.['/var/log/bolsillo-monitor.log']?.slice(-5000), vmDebugAt: vmDebug?.at,
            serverLog: vmDebug?.logs?.['/var/log/bolsillo.log']?.slice(-2000) } : undefined }));
      } catch {}
    };
    setInterval(() => report('tick'), DEBUG ? 5000 : 20000);
    window.addEventListener('error', (e) => mark('error', { msg: String(e.message).slice(0, 300) }));
    window.addEventListener('unhandledrejection', (e) => mark('error', { msg: String(e.reason?.message || e.reason).slice(0, 300) }));

    // Tabs: all in the same page, because iOS freezes background tabs.
    const show = (which) => {
      for (const [sec, btn] of [['chat', 'tChat'], ['panel', 'tPanel'], ['term', 'tTerm'], ['debug', 'tDebug']]) {
        $(sec).classList.toggle('on', which === sec);
        $(btn).setAttribute('aria-pressed', which === sec);
      }
      if (which === 'term') { fit(); xterm.focus(); window.bolsillo.sendTty?.(); }
      if (which === 'debug') renderDebug();
    };
    $('tChat').onclick = () => show('chat');
    $('tPanel').onclick = () => show('panel');
    $('tTerm').onclick = () => show('term');
    $('tDebug').onclick = () => show('debug');
    // In chat mode, Terminal and Debug go in the ⋯ menu (you don't need them to use Claude).
    const more = (open) => { $('more').hidden = !open; $('tMore').setAttribute('aria-expanded', String(open)); };
    $('tMore').onclick = (e) => { e.stopPropagation(); more($('more').hidden); };
    document.addEventListener('click', (e) => { if (!$('more').hidden && !$('more').contains(e.target)) more(false); });
    $('more').addEventListener('click', (e) => { if (e.target.closest('button')) more(false); });

    // ---- Health monitor: Linux memory, browser memory, disk and network, with advice ----
    // Safari doesn't say how much memory the tab uses nor warn before killing it, so we watch what we can
    // see: whether the page died last time without closing, Linux free memory, what has been written to
    // the disk (it lives in the tab's memory), main-thread stalls and the download.
    const health = window.bolsillo.health = { level: '', tips: [] };
    const RUN_KEY = 'bolsillo-running';
    const store = { get: (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
      set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
    const prevRun = store.get(RUN_KEY); // still there if the previous page never closed (Safari killed it)
    const prevCrash = prevRun && Date.now() - prevRun.at < 30 * 60000 ? prevRun : null;
    store.set(RUN_KEY, { at: Date.now(), mem: window.bolsilloDisk.memMB, q: location.search });
    window.addEventListener('pagehide', () => store.set(RUN_KEY, null));
    window.addEventListener('pageshow', (e) => { if (e.persisted) store.set(RUN_KEY, { at: Date.now(), mem: window.bolsilloDisk.memMB, q: location.search }); });
    const lighter = (mem) => [[768, './?mem=768&tb=64&snap=0'], [512, './?mem=512&tb=64&snap=0'], [384, './?mem=384&tb=64&snap=0']]
      .find(([m]) => m < mem);

    let maxLag = 0, lastBeat = Date.now(), lastWait = 0, lastCheck = performance.now();
    setInterval(() => {
      const now = Date.now(), gap = now - lastBeat - 250; // wall clock: also counts the phone sleeping
      if (gap > 10000 && window.bolsillo.bg) window.bolsillo.bg.frozenMs += gap; // the page was frozen
      else maxLag = Math.max(maxLag, gap);
      lastBeat = now;
    }, 250);
    let guest = null, guestAt = 0, guestPending = false;
    // Every question to Linux costs it CPU (seconds, in the emulator): at most one every 30 s.
    let guestAskedAt = 0;
    const askGuest = async () => {
      if (!window.bolsillo.info || guestPending || net.displaced || performance.now() - guestAskedAt < 30000) return;
      guestAskedAt = performance.now();
      guestPending = true;
      try {
        const r = await fetch('/api/health', { cache: 'no-store', signal: AbortSignal.timeout(15000) });
        if (r.ok) {
          guest = await r.json(); guestAt = performance.now();
          const top = guest.top?.[0];
          dlog(`linux: ${guest.totalMB - guest.availMB} MB used, ${guest.availMB} of ${guest.totalMB} MB free · load ${guest.load.toFixed(2)}`
            + (top ? ` · top: ${procName(top)} ${top.cpu ?? '?'}% CPU ${top.rssMB} MB` : ''));
        }
      } catch {} finally { guestPending = false; }
    };

    // A readable name for a Linux process (Node calls all its threads "MainThread").
    const procName = (p) => /claude/.test(p.cmd) ? 'claude' : /server\.js/.test(p.cmd) ? 'Bolsillo server'
      : /bolsillo-monitor/.test(p.cmd) ? 'monitor' : p.name;
    const checkHealth = () => {
      const now = performance.now(), d = window.bolsilloDisk, tips = [];
      const tip = (level, text, link) => tips.push({ level, text, link });
      const waitShare = (d.waitMs - lastWait) / (now - lastCheck); // share of time waiting for the disk
      const lag = Math.max(0, maxLag - (d.waitMs - lastWait)); // stalls that aren't the download
      lastWait = d.waitMs; lastCheck = now; maxLag = 0;

      // The warning about the previous crash stays until this boot has had the panel open for a minute.
      if (prevCrash && !(window.bolsillo.infoAt && now - window.bolsillo.infoAt > 60000)) {
        const l = lighter(prevCrash.mem);
        const ran = Math.round((Date.now() - prevCrash.at) / 60000);

    });

    // If Claude shows the sign-in link in the Terminal, a bar appears to open or copy it.
    let termLinkUrl = '', termLinkTimer = 0;
    const termLinkCheck = () => {
      clearTimeout(termLinkTimer);
      termLinkTimer = setTimeout(() => {
        const plain = tail.replace(/\x1b\[(\d*)C/g, ' ').replace(/\x1b\[[0-9;?<>=]*[ -\/]*[@-~]|\x1b\][^\x07\x1b]*(\x07|\x1b\\)/g, '');
        const url = loginUrl(plain.slice(plain.lastIndexOf('https://claude')));
        if (!url || url === termLinkUrl || !/state=\w{20,}/.test(url)) return;
        termLinkUrl = url; $('termLinkOpen').href = url; $('termLink').hidden = false; dlog('terminal: sign-in link detected');
      }, 500);
    };
    $('termLinkCopy').onclick = async () => {
      try { await navigator.clipboard.writeText(termLinkUrl); $('termLinkCopy').textContent = 'Copied'; }
      catch { prompt('Copy the link:', termLinkUrl); }
    };
    // What Linux writes to the terminal tells us how far along it is.
    // (xterm-pty writes to the terminal with xterm.write: we pick it up there.)
    Object.defineProperty(window.bolsillo, 'tail', { get: () => redact(tail) });
    const termText = new TextDecoder();
    const xtermWrite = xterm.write.bind(xterm);
    xterm.write = (data, cb) => {
      try {
        tail = (tail + (typeof data === 'string' ? data : termText.decode(data, { stream: true }))).slice(-6000);
        if (!window.bolsillo.shell && /Bolsillo: Linux/.test(tail)) { window.bolsillo.shell = true; mark('shell'); }
        if (/oauth\/authorize/.test(tail)) termLinkCheck();
        if (!CHAT && /for shortcuts|bypass permissions/.test(tail)) progress.ready();
      } catch {}
      return xtermWrite(data, cb);
    };

    // ---- Chat: Claude Code without its interface (claude -p with stream-json, see image/chat.sh) ----
    // Claude's terminal interface, inside the emulator, takes minutes to draw each key. Here Safari draws
    // the chat and writes one JSON line per message to the terminal; Claude's answers come back through the
    // same terminal, one JSON line per event. The token is kept on this iPhone and handed to Linux at boot
    // (without echo: it never goes back to the screen or into the reports).
    const chat = { line: '', ready: false, claude: false, busy: false, bubble: null, sent: 0,
      probes: 0, probe: '', login: { state: '', url: '' } };
    const TOKEN_KEY = 'bolsillo-claude-token';
    // Key of the apps backup on the server (see /vm/data in gateway.js): random, one per iPhone. The
    // storage key keeps its original name so existing backups are still found.
    const dataKey = () => {
      let k = '';
      try { k = localStorage.getItem('bolsillo-datos') || ''; } catch {}
      if (!/^[\w-]{32,64}$/.test(k)) {
        k = btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(32)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
        try { localStorage.setItem('bolsillo-datos', k); } catch {}
      }
      return k;
    };
    const getToken = () => { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch { return ''; } };
    const setToken = (t) => { try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch {} };
    const chatState = (t) => { $('chatState').textContent = t; };
    const ascii = (str) => str.replace(/[\u007f-￿]/g, (c) => '\\u' + c.charCodeAt(0).toString(16).padStart(4, '0'));
    const add = (cls, text) => {
      const el = document.createElement('div');
      el.className = `msg ${cls}`; el.textContent = text;
      const log = $('chatLog'), atEnd = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
      log.append(el);
      if (atEnd) log.scrollTop = log.scrollHeight;
      return el;
    };
    const scroll = () => { const log = $('chatLog'); log.scrollTop = log.scrollHeight; };
    const sendToken = (t) => {
      type(`@@TOKEN ${t || '-'}\n`);
      if (!chat.claude) chatState(t ? 'Signed in. Claude Code is loading: you can start writing.' : 'Claude Code is loading. Meanwhile, sign in.');
      dlog(`chat: token ${t ? 'sent to Linux (' + (t.startsWith('sk-ant-oat') ? 'subscription' : 'API key') + ')' : 'none'}`);
    };
    const describeTool = (b) => {
      const i = b.input || {};
      const what = i.command || i.file_path || i.path || i.pattern || i.url || i.description || '';
      return `🔧 ${b.name}${what ? ': ' + String(what).slice(0, 160) : ''}`;
    };
    const onEvent = (ev) => {
      if (ev.type === 'control_response' && ev.response?.request_id === chat.probe) {
        chat.claude = true; progress.ready();
        if (!chat.busy) chatState(getToken() ? 'Claude is ready: write below.' : "Claude is ready, but you haven't signed in yet.");
        dlog('chat: Claude ready (initialize)'); return;
      }
      if (ev.type === 'system' && ev.subtype === 'init') { chat.claude = true; chatState(`Claude ready · ${ev.model || ''}`); dlog('chat: Claude ready'); }
      else if (ev.type === 'system' && ev.subtype === 'api_retry') chatState(`Retrying the connection to Claude (${ev.attempt}/${ev.max_retries})…`);
      else if (ev.type === 'stream_event') {
        const e = ev.event || {};
        if (e.type === 'content_block_start' && e.content_block?.type === 'text') chat.bubble = add('cc', '');
        else if (e.type === 'content_block_delta' && e.delta?.type === 'text_delta') {
          chat.bubble ??= add('cc', '');
          chat.bubble.textContent += e.delta.text; scroll();
        } else if (e.type === 'content_block_stop') chat.bubble = null;
      } else if (ev.type === 'assistant') {
        for (const b of ev.message?.content || []) if (b.type === 'tool_use') add('tool', describeTool(b));
        // Without partial messages (if they didn't arrive), the whole text comes here.
        const text = (ev.message?.content || []).filter((b) => b.type === 'text').map((b) => b.text).join('');
        if (text && !chat.streamed) add('cc', text);
        scroll();
      } else if (ev.type === 'user') {
        for (const b of ev.message?.content || []) if (b.type === 'tool_result') add('tool', `  ↳ ${String(Array.isArray(b.content) ? b.content.map((c) => c.text || '').join('') : b.content || '').split('\n')[0].slice(0, 120)}`);
      } else if (ev.type === 'result') {
        chat.busy = false; chat.bubble = null;
        if (ev.is_error || ev.subtype !== 'success') {
          const msg = ev.result || ev.errors?.join(' ') || ev.subtype;
          add('err', `⚠️ ${msg}`);
          if (/log ?in|api key|auth|401|403|credit/i.test(msg)) { setToken(''); loginBox(); chatState('The session is no longer valid: sign in again.'); }
          else chatState('Claude returned an error.');
        } else chatState(`Done · ${(ev.duration_ms / 1000).toFixed(0)} s${ev.total_cost_usd ? ` · ${ev.total_cost_usd.toFixed(3)} $` : ''}`);
        scroll();
      }
      if (ev.type === 'stream_event') chat.streamed = true;
    };
    // Sign-in with the subscription (Pro/Max), inside the chat itself and without waiting for Linux. The
    // Bolsillo server does the same flow as "claude setup-token" (see /vm/login in gateway.js):
    //   1. the chat shows a message with a "Connect with Claude" button (the link already prepared: Safari
    //      only opens new tabs if the link exists before it is tapped);
    //   2. you authorize on claude.ai, which shows a code with "Copy Code";
    //   3. it's pasted (button or normal chat box): the page recognizes it as a code (not a message), the
    //      server swaps it for a one-year token and hands it to Claude, which picks it up even if it is
    //      already running (preload.mjs). Messages written earlier are sent then.
    // An sk-ant-… token made with "claude setup-token" on another computer also works there.
    const isCode = (t) => /^[\w-]{20,}(#[\w-]{20,})?$/.test(t) || /^https:\/\/[^ ]*[?&]code=/.test(t);
    const loginBox = () => {
      if (chat.login.box?.isConnected) { chat.login.box.scrollIntoView(); return; }
      const el = add('cc login', '');
      el.append('Connect your Claude account (Pro or Max). Only the first time:');
      const a = Object.assign(document.createElement('a'), { textContent: '1 · Connect with Claude', target: '_blank', rel: 'noopener', className: 'go' });
      a.setAttribute('aria-disabled', '');
      const help = document.createElement('span');
      help.textContent = 'claude.ai opens in another tab: tap "Authorize" and then "Copy Code". Then come back to this tab.';
      const paste = Object.assign(document.createElement('a'), { textContent: '2 · Paste code and sign in', href: '#' });
      paste.className = 'second';
      paste.onclick = async (e) => {
        e.preventDefault();
        let code = '';
        try { code = (await navigator.clipboard.readText()).trim(); } catch {}
        if (code) { add('me', '🔑 claude.ai code'); scroll(); sendCode(code); }
        else { $('chatInput').focus(); chatState("I couldn't read the clipboard: long-press the box below, \"Paste\" and Send."); }
      };
      a.addEventListener('click', () => { chat.login.opened = true; el.classList.add('opened'); });
      // To authorize in another browser or device: the link is copied (or shown to copy by hand).
      const copy = Object.assign(document.createElement('a'), { textContent: 'Copy the link to open it in another browser', href: '#', className: 'copy' });
      copy.onclick = async (e) => {
        e.preventDefault();
        if (!chat.login.url) return;
        try { await navigator.clipboard.writeText(chat.login.url); copy.textContent = 'Link copied ✓ (then paste the code here)'; }
        catch {
          const i = Object.assign(document.createElement('input'), { readOnly: true, value: chat.login.url });
          copy.replaceWith(i); i.focus(); i.select();
        }
        chat.login.opened = true; el.classList.add('opened');
      };
      el.append(a, help, paste, copy);
      chat.login.box = el; chat.login.a = a;
      $('chatInput').placeholder = 'Paste the claude.ai code here…';
      newLink();
    };
    const newLink = async () => {
      try {
        const r = await fetch('login', { cache: 'no-store' });
        const j = await r.json();
        if (!j.url) throw new Error(j.error || r.status);
        chat.login.state = j.state; chat.login.url = j.url;
        chat.login.a.href = `go?u=${encodeURIComponent(j.url)}`; chat.login.a.removeAttribute('aria-disabled');
        dlog('chat: sign-in link ready');
      } catch (e) { add('err', `Couldn't prepare the claude.ai link (${e.message}). Reload the page.`); }
    };
    const useToken = (t, how) => {
      setToken(t);
      chat.login.box?.remove(); chat.login.box = null;
      $('chatInput').placeholder = 'Write to Claude…';
      add('cc', `✅ ${how}. It stays saved on this iPhone for next time.`);
      if (chat.ready) sendToken(t);
      flush();
    };
    const sendCode = async (code) => {
      // The full address of the code page (…/callback?code=…&state=…) also works.
      try { const u = new URL(code); if (u.searchParams.get('code')) code = `${u.searchParams.get('code')}#${u.searchParams.get('state') || ''}`; } catch {}
      if (/^sk-ant-/.test(code)) return useToken(code, 'Token saved');
      chatState('Checking the code with claude.ai…'); dlog('chat: sign-in code sent');
      try {
        const r = await fetch('login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ state: chat.login.state, code }) });
        const j = await r.json();
        if (!j.token) throw new Error(j.error || r.status);
        dlog('chat: subscription token received');
        useToken(j.token, 'Signed in with your Claude account');
      } catch (e) {
        add('err', `⚠️ ${e.message}`); chatState('Open claude.ai again: the link has been renewed.');
        chat.login.a.setAttribute('aria-disabled', ''); newLink(); chat.login.box.scrollIntoView();
      }
    };
    // Messages written before signing in or before Linux boots: they're sent as soon as possible.
    const pending = [];
    const flush = () => {
      if (!chat.ready || !getToken()) return;
      while (pending.length) { chat.busy = true; type(ascii(JSON.stringify({ type: 'user', message: { role: 'user', content: pending.shift() } })) + '\n'); }
      chatState(chat.claude ? 'Claude is thinking…' : "Sent: Claude will read it as soon as it's done loading.");
    };
    // How we ask Claude whether it has loaded: it answers "initialize" without calling the API.
    const probe = () => { chat.probe = `ready-${++chat.probes}`; type(`{"type":"control_request","request_id":"${chat.probe}","request":{"subtype":"initialize"}}\n`); };
    const loginUrl = (text) => {
      const m = /https:\/\/claude\.(?:ai|com)\/\S*oauth\/authorize\?[\s\S]*?(?=(?:\r*\n){2}|Paste code|$)/.exec(text);
      return m ? m[0].replace(/\s+/g, '') : '';
    };
    const onLine = (line) => {
      const m = /@@BOLSILLO (.+?)@@/.exec(line);
      if (m) {
        const what = m[1];
        dlog(`chat: ${what}`);
        if (what === 'chat ready') {
          // Claude starts loading now, signed in or not: if the token arrives later, it picks it up on the fly.
          chat.ready = true; progress.linuxReady();
          type(`@@DATA ${new URL(`data/${dataKey()}`, location.href).href}\n`);
          sendToken(getToken());
          probe(); // from a snapshot Claude is already open and there won't be a "claude starting"
          flush();
        } else if (what.startsWith('data restored')) {
          const n = Number(what.split(' ')[2]) || 0;
          if (n) add('cc', `📦 Your apps are back (${n}). You'll find them in the Apps tab.`);
        } else if (what === 'claude starting') {
          if (!chat.claude) chatState("Claude Code is loading: you can start writing, I'll pass it on as soon as it's ready.");
          probe();
        } else if (what.startsWith('claude exited')) {
          chat.claude = false; chat.busy = false;
          add('err', `Claude closed (${what.slice(14)}); it's being reopened.`); chatState('Claude is reopening…');
        }
        return;
      }
      if (line[0] !== '{') return;
      try { onEvent(JSON.parse(line)); } catch {}
    };
    if (CHAT) {
      $('more').prepend($('tTerm'), $('tDebug'));
      $('tMore').hidden = false;
      $('mCopyToken').onclick = async () => {
        const t = getToken();
        if (!t) { add('cc', "You haven't signed in yet."); return; }
        try { await navigator.clipboard.writeText(t); add('cc', "Token copied. It works as CLAUDE_CODE_OAUTH_TOKEN on another computer; don't share it."); }
        catch { prompt('Your token (copy it):', t); }
      };
      $('mLogout').onclick = () => {
        if (!getToken() || !confirm('Sign out of Claude on this iPhone?')) return;
        setToken(''); if (chat.ready) type('@@TOKEN -\n');
        add('cc', 'Signed out.'); loginBox();
      };
      $('tChat').hidden = false;
      show('chat');
      xterm.write = ((inner) => (data, cb) => {
        try {
          const text = typeof data === 'string' ? data : chatText.decode(data, { stream: true });
          const parts = (chat.line + text).split('\n');
          chat.line = parts.pop().slice(-200000);
          for (const p of parts) onLine(p.replace(/\r$/, ''));
        } catch {}
        return inner(data, cb);
      })(xterm.write);
      $('chatForm').onsubmit = (e) => {
        e.preventDefault();
        const text = $('chatInput').value.trim();
        if (!text) return;
        $('chatInput').value = '';
        if (!getToken() && (isCode(text) || /^sk-ant-/.test(text))) { add('me', '🔑 claude.ai code'); scroll(); sendCode(text); return; }
        add('me', text); scroll();
        chat.sent++; pending.push(text);
        if (!getToken()) { loginBox(); chatState("I'll send it as soon as you sign in."); return; }
        if (!chat.ready) { chatState("I'll send it as soon as Linux boots."); return; }
        flush();
      };
      $('chatInput').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('chatForm').requestSubmit(); } });
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && chat.login.opened && chat.login.box?.isConnected) { chat.login.box.scrollIntoView({ block: 'center' }); chatState('Now tap "2 · Paste code and sign in".'); }
      });
      // From a snapshot Linux was already waiting: we set its clock and it answers "chat ready".
      if (window.bolsilloDisk.useSnapshot) {
        const hello = setInterval(() => {
          if (chat.ready) { clearInterval(hello); return; }
          if (window.bolsillo.events.some((e) => e.name === 'module')) type(`@@HELLO ${Math.round(Date.now() / 1000)}\n`);
        }, 5000);
      }
      // Without a saved session, sign-in starts right away, while Linux boots.
      if (!getToken()) loginBox();
    }

    Module['arguments'] = bolsilloArgs(Module['arguments']);
    // The terminal size goes on the kernel command line: Linux applies it before opening Claude, without
    // waiting for the Bolsillo server to start (minutes on the iPhone).
    const ap = Module['arguments'].indexOf('-append');
    if (ap !== -1) Module['arguments'][ap + 1] = Module['arguments'][ap + 1].replace(' init=', ` bolsillo.cols=${xterm.cols} bolsillo.rows=${xterm.rows}${CHAT ? ' bolsillo.mode=chat' : ''} init=`);
    Module['setStatus'] = (text) => { if (text) status(text); };
    status('Downloading Linux…');
    mark('start', { mem: window.bolsilloDisk.memMB, snapshot: window.bolsilloDisk.useSnapshot });
    initEmscriptenModule(Module).then(() => mark('module')).catch((e) => { status("Didn't start: " + e.message, 'bad'); mark('error'); });

    // Wait for the Bolsillo panel to answer inside Linux and then show it.
    let tries = 0;
    const poll = async () => {
      tries++;
      const d = window.bolsilloDisk;
      status(`Booting Linux… ${secs()} s · disk ${d.fetchedMB} MB downloaded`);
      try {
        const r = await fetch('/api/info', { cache: 'no-store' });
        if (r.ok) {
          window.bolsillo.info = await r.json();
          window.bolsillo.infoAt = performance.now();
          mark('panel');
          window.bolsillo.sendTty();
          status(`Ready in ${secs()} s · ${window.bolsillo.info.claude || 'Claude Code not checked'}`, 'ok');
          $('panel').innerHTML = '<iframe src="/" title="Bolsillo"></iframe>';
          return;
        }
      } catch (e) {}
      setTimeout(poll, tries < 20 ? 3000 : 6000);
    };
    setTimeout(poll, 5000);
  </script>
</body>
</html>
