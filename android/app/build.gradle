plugins {
    id 'com.android.application'
}

// The Bolsillo server (Node) travels inside the APK as assets and is copied into the
// phone's Linux on first run.
def bolsilloAssets = layout.buildDirectory.dir('generated/bolsillo-assets')
def syncBolsillo = tasks.register('syncBolsillo', Sync) {
    from(rootProject.file('..')) {
        include 'server.js', 'package.json', 'lib/**', 'public/**', 'templates/**'
    }
    into bolsilloAssets.map { it.dir('bolsillo') }
}

android {
    namespace 'app.bolsillo'
    compileSdk 35

    defaultConfig {
        applicationId 'app.bolsillo'
        minSdk 26
        // 28 on purpose: newer targets forbid running programs from the app's own files,
        // which is exactly what a Linux on the phone needs (same choice as Termux).
        // Fine for installing the APK directly; Google Play would not accept it.
        targetSdk 28
        versionCode 2
        versionName '0.2.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }

    signingConfigs {
        release {
            def ks = System.getenv('BOLSILLO_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('BOLSILLO_KEYSTORE_PASS')
                keyAlias 'bolsillo'
                keyPassword System.getenv('BOLSILLO_KEYSTORE_PASS')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('BOLSILLO_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    // Keep the .so files extracted on disk so proot can be executed.
    packagingOptions { jniLibs { useLegacyPackaging true } }

    // Default patterns drop folders starting with "_" (templates/_shared).
    androidResources { ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~' }

    sourceSets { main { assets.srcDirs += new File(buildDir, 'generated/bolsillo-assets') } }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

tasks.named('preBuild') { dependsOn syncBolsillo }
