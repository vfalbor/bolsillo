<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bolsillo</title>
  <style>
    :root { --bg: #f4efe6; --surface: #fffdf9; --ink: #26211c; --soft: #7b7064; --line: #e4dccf; --accent: #d9622b; }
    @media (prefers-color-scheme: dark) { :root { --bg: #171513; --surface: #221f1c; --ink: #f1ebe3; --soft: #a3988b; --line: #37322d; --accent: #f07a3e; } }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, sans-serif; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 24px; text-align: center; }
    .logo { width: 88px; height: 88px; margin-bottom: 18px; }
    h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: -.02em; }
    #msg { color: var(--soft); min-height: 1.5em; max-width: 340px; }
    .bar { width: min(300px, 80vw); height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 22px 0 10px; }
    .fill { height: 100%; width: 30%; background: var(--accent); border-radius: 99px; transition: width .3s; }
    .bar.indeterminate .fill { animation: slide 1.3s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
    .first { font-size: 13px; color: var(--soft); max-width: 320px; }
    details { margin-top: 26px; width: min(560px, 100%); text-align: left; }
    summary { color: var(--soft); font-size: 13px; cursor: pointer; text-align: center; }
    pre { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; font-size: 11px;
      max-height: 40vh; overflow: auto; white-space: pre-wrap; word-break: break-word; }
    button { margin-top: 18px; border: 0; background: var(--accent); color: #fff; font: inherit; font-weight: 650; border-radius: 99px; padding: 11px 26px; }
    .error #msg { color: #c33; }
  </style>
</head>
<body>
  <svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="24" fill="#d9622b"/><path d="M28 34h44v30a14 14 0 0 1-14 14H42a14 14 0 0 1-14-14z" fill="#fffdf9"/><path d="M28 34q22 14 44 0" fill="none" stroke="#d9622b" stroke-width="5"/><path d="M44 52l-6 6 6 6M56 52l6 6-6 6" fill="none" stroke="#26211c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <h1>Bolsillo</h1>
  <div id="msg">Arrancando…</div>
  <div class="bar indeterminate" id="bar"><div class="fill" id="fill"></div></div>
  <p class="first" id="first" hidden>La primera vez preparamos un Linux dentro de tu móvil con Node.js y Claude Code. Necesita conexión y unos minutos; después arranca en segundos.</p>
  <button id="retry" hidden>Reintentar</button>
  <details><summary>Ver detalles</summary><pre id="log"></pre></details>
  <script>
    const target = location.hash.slice(1) || '/';
    const $ = (id) => document.getElementById(id);
    function tick() {
      if (!window.BolsilloApp) { $('msg').textContent = 'Abre esta pantalla desde la app Bolsillo.'; return; }
      let s;
      try { s = JSON.parse(BolsilloApp.status()); } catch { s = {}; }
      if (s.stage === 'ready') { location.replace(s.url.replace(/\/$/, '') + target); return; }
      document.body.classList.toggle('error', s.stage === 'error');
      $('msg').textContent = s.stage === 'error' ? `${s.message}: ${s.error}` : (s.message || 'Arrancando…');
      $('first').hidden = !['download', 'extract', 'packages'].includes(s.stage);
      $('retry').hidden = s.stage !== 'error';
      $('bar').hidden = s.stage === 'error';
      const p = Number(s.progress);
      $('bar').classList.toggle('indeterminate', !(p >= 0 && p < 1));
      $('fill').style.width = p >= 0 && p < 1 ? `${Math.round(p * 100)}%` : '30%';
      const log = (s.log || []).join('\n');
      if ($('log').textContent !== log) { $('log').textContent = log; $('log').scrollTop = 1e9; }
      setTimeout(tick, 500);
    }
    $('retry').onclick = () => { BolsilloApp.retry(); $('retry').hidden = true; };
    tick();
  </script>
</body>
</html>
